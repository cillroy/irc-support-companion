; Support Companion bridge for mIRC
; Edit the three paths below to match your machine, then load this file in mIRC (Alt+R → File → Load).
; Keep the Python app and this script in the same folder (or update %scpy.app / %scpy.out).

[script]
n0=menu channel,status,menubar,query {
n1=  Support Companion
n2=  .Basic:scpy-open basic
n3=  .Disabled:scpy-open disabled
n4=  .Low Ratio:scpy-open ratio
n5=}
n6=
n7=alias scpy-open {
n8=  ; Restrict which windows can launch the companion. Edit channel/query/network for your site.
n9=  if (( $active != #support && $active != your_nick ) || ($network != example.org)) {
n10=    echo -a (Support Companion) Open this from #support or your_nick on example.org.
n11=    return
n12=  }
n13=
n14=  var %mode = $1
n15=  var %id = $ticks $+ _ $+ $rand(1000,9999)
n16=
n17=  set $+(%,scpy.target.,%id) $active
n18=  set $+(%,scpy.cid.,%id) $activecid
n19=
n20=  ; --- edit these three lines for your install ---
n21=  set %scpy.pythonw C:\Path\To\pythonw.exe
n22=  set %scpy.app $qt(C:\Path\To\Support-Companion\support_companion.py)
n23=  set %scpy.out C:\Path\To\Support-Companion\handoff
n24=  ; -----------------------------------------------
n25=
n26=  mkdir %scpy.out
n27=
n28=  run -n $qt(%scpy.pythonw) %scpy.app --request-id %id --mode %mode --outdir $qt(%scpy.out)
n29=
n30=  .timerSCpy. $+ %id 0 1 scpy-check %id
n31=}
n32=
n33=alias scpy-check {
n34=  var %id = $1
n35=  var %file = %scpy.out $+ \response_ $+ %id $+ .txt
n36=
n37=  if (!$isfile(%file)) return
n38=
n39=  .timerSCpy. $+ %id off
n40=
n41=  var %msg = $read(%file,nt,1)
n42=  var %target = $($+(%,scpy.target.,%id),2)
n43=  var %cid = $($+(%,scpy.cid.,%id),2)
n44=
n45=  if ((%msg == $null) || (%target == $null) || (%cid == $null)) {
n46=    echo -a (Support Companion) Invalid or expired response.
n47=  }
n48=  else {
n49=    scid %cid msg %target %msg
n50=  }
n51=
n52=  remove %file
n53=  unset $+(%,scpy.target.,%id)
n54=  unset $+(%,scpy.cid.,%id)
n55=}
